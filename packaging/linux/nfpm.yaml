# .deb and .rpm packages, built by nfpm (packaging/linux/build.sh). VERSION and ARCH come from the environment.
name: offlok
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: LokLakh <contact@loklakh.fr>
vendor: LokLakh
homepage: https://github.com/LokLakh-s/OffLok
license: MIT
description: |
  Your computer as its own DNS resolver.
  OffLok runs Unbound in recursive mode, straight from the root servers, and points
  the system DNS at it: no internet provider, Google, Cloudflare or Quad9 in between.
  When the root servers are out of reach (a hotel's Wi-Fi), it falls back to the
  network's DNS, or never does in strict mode.
depends:
  - unbound
contents:
  - src: ./bin/pkg/offlokd
    dst: /usr/bin/offlokd
  - src: ./bin/pkg/offlok
    dst: /usr/bin/offlok
  - src: ./packaging/linux/offlokd.service
    dst: /usr/lib/systemd/system/offlokd.service
  - src: ./packaging/linux/org.loklakh.offlok.policy
    dst: /usr/share/polkit-1/actions/org.loklakh.offlok.policy
  - src: ./LICENSE
    dst: /usr/share/doc/offlok/copyright
scripts:
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh
  postremove: ./packaging/linux/postremove.sh
