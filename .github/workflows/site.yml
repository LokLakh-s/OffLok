# offlok.org: the website (site/), built with the latest published release's download links and served by GitHub
# Pages. At each push to main that changes it (unless the push raises VERSION: then its release deploys it), after
# each successful run of the Release workflow (a release published with GITHUB_TOKEN starts no workflow by itself),
# and by hand.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: offlok-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The links point at the latest release on GitHub, not at VERSION, which moves before a release is out. A push
      # that raises VERSION waits for its release, whose run deploys the site: its pages may offer files (a new
      # platform's) that only the new release has.
      - name: The release the links point at
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "v$(cat VERSION)" ]; then
            echo "VERSION $(cat VERSION) is not released yet (the latest is $tag): the Release workflow deploys the site."
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi

      - name: The pages
        if: steps.release.outputs.ready == 'true'
        run: site/build.sh "${{ steps.release.outputs.tag }}"

      - if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bin/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
