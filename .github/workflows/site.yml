# offlok.org: the website (site/), built with the latest published release's download links and served by GitHub
# Pages. At each push to main that changes it, after each successful run of the Release workflow (a release
# published with GITHUB_TOKEN starts no workflow by itself), and by hand.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: offlok-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The links point at the latest release on GitHub, not at VERSION, which moves before a release is out.
      - name: The pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bin/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
