# OffLok's releases: a tag v<VERSION> builds the Linux packages and the Windows installer, tests the installer on
# one of GitHub's Windows machines, builds and tests the macOS package on one of its Macs, builds the Android app and
# tests it on an emulator, signs the app with its Android release key, then publishes them on GitHub Releases with
# SHA256SUMS, signed with OffLok's release key (docs/PLAN.md, "Updates and security"), and a
# build provenance attestation once the repository is public.
#
# Every job runs on GitHub's own machines, never on a self-hosted one: SignPath, which will sign the Windows
# programs, only signs what such a workflow built. The release key is the release environment's secret, which only v* tags reach.
# Run by hand on a branch, it is a rehearsal: it builds and tests, and publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: offlok-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_IMAGE: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the CI's check below compares this commit with earlier ones

      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

      # The integration tests need containers with systemd: the CI ran them on this commit, or on an earlier one with
      # nothing since that the CI tests (a push that changes none of its paths starts no CI).
      - name: The CI passed on this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --status success --limit 50 \
            --json headSha --jq '.[].headSha' | awk '!seen[$0]++'); do
            if git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null &&
              python3 -I packaging/release/untouched.py .github/workflows/ci.yml "$sha" "$GITHUB_SHA"; then
              echo "The CI passed on $sha"
              exit 0
            fi
          done
          echo "::error::The CI has not passed on this commit, nor on an earlier one with nothing since that it tests"
          exit 1

      # Go's caches are shared by both images through the runner's temporary folder.
      - name: Tests and Linux packages
        run: |
          mkdir -p "$RUNNER_TEMP/go"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOFLAGS=-buildvcs=false \
            -e GOCACHE=/go/cache -e GOMODCACHE=/go/mod -v "$RUNNER_TEMP/go:/go" \
            -v "$PWD:/src" -w /src "$GO_IMAGE" bash -euo pipefail -c '
              go vet ./...
              go test -count=1 -timeout 5m ./...
              ./packaging/linux/build.sh'

      - name: Desktop packages and the Windows installer
        run: |
          docker build -q -t offlok-desktop-build packaging/linux/desktop-build >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOFLAGS=-buildvcs=false \
            -e GOCACHE=/go/cache -e GOMODCACHE=/go/mod -v "$RUNNER_TEMP/go:/go" \
            -v "$PWD:/src" -w /src offlok-desktop-build bash -euo pipefail -c '
              ./packaging/linux/build-desktop.sh
              ./packaging/windows/build.sh'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.deb
            dist/*.rpm
            dist/offlok-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Install, check, uninstall
        shell: pwsh
        run: ./test/windows/test.ps1

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: OpenSSL's libraries, kept between runs of the same sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/darwin/unbound-build/openssl-*-arm64
            bin/darwin/unbound-build/openssl-*-x86_64
            bin/darwin/unbound-build/*.tar.gz
          key: macos-openssl-${{ hashFiles('packaging/macos/sources.env', 'packaging/macos/build-unbound.sh') }}

      - name: Unbound, with OpenSSL linked in, and the package
        run: |
          ./packaging/macos/build-unbound.sh
          ./packaging/macos/build-pkg.sh

      - name: Install, check, uninstall
        run: ./test/macos/test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/offlok-*.pkg
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The NDK and the SDK, as android.env pins them
        run: |
          . packaging/android/android.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" \
            "platforms;android-$ANDROID_TARGET_API" "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: libunbound and OpenSSL, kept between runs of the same sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            internal/libunbound/_native
            bin/android/native-build/*.tar.gz
          key: android-native-${{ hashFiles('packaging/macos/sources.env', 'packaging/android/android.env', 'packaging/android/build-native.sh') }}

      - name: libunbound and OpenSSL, the core, the app (unsigned; Google Play's as a bundle)
        run: |
          ./packaging/android/build-native.sh
          ./packaging/android/build-core.sh
          cd android && ./gradlew --no-daemon assembleFullDebug assembleFullRelease bundlePlayRelease

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The app on an emulator (the same code's debug build, which the test drives)
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./test/android/test.sh android/app/build/outputs/apk/full/debug/app-full-debug.apk

      # Not release*: publish signs them first.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: |
            android/app/build/outputs/apk/full/release/app-full-release-unsigned.apk
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, windows, macos, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/android

      # One key for GitHub, F-Droid and Google Play: the APK goes in the release, the bundle to Google Play (an
      # artifact, uploaded by hand). The certificate must be the one android.env names.
      - name: The Android app, signed with its release key
        env:
          KEYSTORE: ${{ secrets.OFFLOK_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.OFFLOK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          . packaging/android/android.env
          version=${GITHUB_REF_NAME#v}
          tools=$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS
          [ -x "$tools/apksigner" ] ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          umask 077
          ks=$RUNNER_TEMP/android.keystore
          printf '%s' "$KEYSTORE" | base64 -d >"$ks"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias offlok --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD --out "dist/offlok-$version.apk" \
            "$RUNNER_TEMP/android/apk/full/release/app-full-release-unsigned.apk"
          jarsigner -keystore "$ks" -storepass:env KEYSTORE_PASSWORD \
            -signedjar "$RUNNER_TEMP/offlok-$version-play.aab" "$RUNNER_TEMP/android/bundle/playRelease/app-play-release.aab" offlok >/dev/null
          rm "$ks"
          cert=$("$tools/apksigner" verify --print-certs "dist/offlok-$version.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "dist/offlok-$version.apk: certificate $cert"
          test "$cert" = "$ANDROID_CERT_SHA256"
          rm -f "dist/offlok-$version.apk.idsig"

      - name: Keep Google Play's bundle (to upload to the Play Console)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-bundle
          path: ${{ runner.temp }}/offlok-*-play.aab
          if-no-files-found: error
          retention-days: 30

      # SHA256SUMS names every file with its hash; its signature is what the app checks before an update, and what
      # anyone can check by hand (the notes say how).
      - name: Checksums, signed with the release key
        env:
          RELEASE_KEY: ${{ secrets.OFFLOK_RELEASE_KEY }}
        run: |
          cp packaging/release/offlok-release-*.pub.pem dist/
          cd dist
          sha256sum -- *.deb *.rpm *.exe *.pkg *.apk *.pem >SHA256SUMS
          umask 077
          printf '%s\n' "$RELEASE_KEY" >"$RUNNER_TEMP/release.key"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm "$RUNNER_TEMP/release.key"
          openssl pkeyutl -verify -pubin -inkey offlok-release-*.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          cat SHA256SUMS

      # GitHub attests builds of public repositories only.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.pkg
            dist/*.apk

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          ./packaging/release/notes.sh "$version" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "OffLok $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
