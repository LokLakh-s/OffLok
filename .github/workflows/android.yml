# OffLok for Android, on GitHub's Linux machines: the libunbound engine's and the core's tests against Debian's
# libunbound, then libunbound and OpenSSL built with the NDK (packaging/android/build-native.sh, kept between runs of
# the same sources), the Go core as two Android libraries (build-core.sh: the full one, and Google Play's without ad
# blocking), the app (Gradle: the full debug build, both release builds, Google Play's bundle), a check that Google
# Play's carries no ad list, and test/android/test.sh on an emulator: the VPN, resolution through it, DNSSEC,
# blocking, off.
name: Android

on:
  push:
    branches: [main, android] # android: while the app is written; dropped when it is merged
    paths-ignore: ['**.md', 'docs/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: offlok-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The engine and the core, with Debian's libunbound
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libunbound-dev >/dev/null
          go vet -tags libunbound ./internal/libunbound/ ./mobile/
          go test -count=1 -race -tags libunbound ./internal/libunbound/ ./internal/tun/ ./mobile/
          go test -count=1 -tags noads ./internal/blocklist/ ./internal/daemon/

      - name: The NDK and the SDK, as android.env pins them
        run: |
          . packaging/android/android.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" \
            "platforms;android-$ANDROID_TARGET_API" "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      # Saved as soon as they are built: a later step's failure does not throw them away.
      - name: libunbound and OpenSSL, kept between runs of the same sources
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            internal/libunbound/_native
            bin/android/native-build/*.tar.gz
          key: android-native-${{ hashFiles('packaging/macos/sources.env', 'packaging/android/android.env', 'packaging/android/build-native.sh') }}

      - name: libunbound and OpenSSL, with the NDK
        run: ./packaging/android/build-native.sh

      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            internal/libunbound/_native
            bin/android/native-build/*.tar.gz
          key: ${{ steps.native.outputs.cache-primary-key }}

      - name: The Go core, for the app
        run: ./packaging/android/build-core.sh

      - name: The app
        working-directory: android
        run: ./gradlew --no-daemon assembleFullDebug assembleFullRelease assemblePlayRelease bundlePlayRelease

      - name: Google Play's app carries no ad list
        run: |
          set -euo pipefail
          out=android/app/build/outputs
          ls -l $out/apk/*/* $out/bundle/*/*
          for apk in $out/apk/full/release/*.apk $out/apk/play/release/*.apk; do
            n=$(unzip -p "$apk" lib/x86_64/libgojni.so | grep -c 'filter_1\.txt\|AdGuard DNS filter' || true)
            echo "$apk: $n"
            case $apk in
            */play/*) [ "$n" -eq 0 ] ;;
            *) [ "$n" -gt 0 ] ;;
            esac
          done

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The app on an emulator
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./test/android/test.sh android/app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Keep the apps a day (to try them on a phone)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apps
          path: |
            android/app/build/outputs/apk/full/debug/*.apk
            android/app/build/outputs/apk/*/release/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
          retention-days: 1
          if-no-files-found: ignore
