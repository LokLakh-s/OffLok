# Temporary: what macOS does, on GitHub's macOS 26 machine, before OffLok's macOS code is written. Removed before
# the macos branch is merged.
name: macOS exploration

on:
  push:
    branches: [macos]
    paths: ['.github/workflows/macos-explore.yml']

permissions:
  contents: read

jobs:
  explore:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: The system
        run: |
          sw_vers; uname -a; id; sysctl -n hw.ncpu hw.memsize
          echo "LANG=$LANG"; defaults read -g AppleLanguages || true; defaults read -g AppleLocale || true
          ls -la /etc/ssl/cert.pem /etc/resolv.conf; ls -la /etc/resolver 2>&1 || true
          which dig pkgbuild productbuild lipo go brew clang; xcode-select -p; go version || true
          dscl . -list /Users UniqueID | awk '$2 < 500' | sort -n -k2 | tail -8
          dscl . -list /Groups PrimaryGroupID | awk '$2 < 500' | sort -n -k2 | tail -5
          sudo lsof -nP -iUDP:53 -iTCP:53 || true

      - name: Network services and their DNS
        run: |
          networksetup -listallnetworkservices
          networksetup -listnetworkserviceorder
          networksetup -listallnetworkservices | tail -n +2 | sed 's/^\*//' | while IFS= read -r s; do
            echo "== $s"; networksetup -getdnsservers "$s"; networksetup -getsearchdomains "$s"; networksetup -getinfo "$s" | head -8
          done
          LANG=fr_FR.UTF-8 networksetup -getdnsservers "$(networksetup -listallnetworkservices | sed -n 2p)"
          scutil --dns | head -40
          printf 'list State:/Network/Service/[^/]+/DNS\nlist Setup:/Network/Service/[^/]+/DNS\nshow State:/Network/Global/IPv4\nshow State:/Network/Global/IPv6\nshow State:/Network/Global/DNS\n' | scutil
          for k in $(printf 'list State:/Network/Service/[^/]+/DNS\n' | scutil | awk '{print $4}'); do echo "== $k"; printf 'show %s\n' "$k" | scutil; done
          route -n get default | head -8; ifconfig -a | grep -E '^[a-z]|inet' | head -30
          ipconfig getoption en0 domain_name_server || true

      - name: Setting a service's DNS, then giving it back
        run: |
          svc=$(networksetup -listnetworkserviceorder | sed -n 's/^([0-9]*) //p' | head -1)
          id=$(printf 'show State:/Network/Global/IPv4\n' | scutil | awk '/PrimaryService/ {print $3}')
          echo "service: $svc, primary: $id"
          sudo networksetup -setdnsservers "$svc" 127.0.0.1 ::1; echo "exit $?"
          networksetup -getdnsservers "$svc"
          printf 'show State:/Network/Service/%s/DNS\nshow Setup:/Network/Service/%s/DNS\nshow State:/Network/Global/DNS\n' "$id" "$id" | scutil
          scutil --dns | sed -n 1,20p
          sudo networksetup -setdnsservers "$svc" Empty; echo "exit $?"
          networksetup -getdnsservers "$svc"
          printf 'show State:/Network/Service/%s/DNS\nshow Setup:/Network/Service/%s/DNS\nshow State:/Network/Global/DNS\n' "$id" "$id" | scutil
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; echo "flush exit $?"

      - name: The root servers, IPv6, Homebrew's Unbound
        run: |
          dig +norec +time=3 +tries=1 org. NS @198.41.0.4 | grep -E 'status|flags|AUTHORITY' || true
          dig +norec +time=3 +tries=1 org. NS @2001:503:ba3e::2:30 | grep -E 'status|flags' || echo "no IPv6 to the root"
          ping6 -c1 -t3 2001:4860:4860::8888 >/dev/null && echo "IPv6 ok" || echo "no IPv6"
          time brew install unbound
          ls -la "$(brew --prefix)/sbin/unbound"; "$(brew --prefix)/sbin/unbound" -V | head -3
          otool -L "$(brew --prefix)/sbin/unbound"
